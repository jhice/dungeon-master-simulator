<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dungeon Master Simulator</title>
    <link rel="stylesheet" href="styles/main.css" />
    <link rel="stylesheet" href="styles/tiles-2d.css" />
    <!-- Three.js is only loaded when the 3D renderer is selected. -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <header class="toolbar">
      <h1>Dungeon Master Simulator</h1>
      <span id="level-label" class="level-label"></span>
      <button id="shortcuts-button" class="shortcuts-button" type="button">Keyboard shortcuts <kbd>H</kbd></button>
    </header>
    <div id="status" class="status">&nbsp;</div>
    <main id="view-wrap">
      <div id="view"></div>
    </main>
    <footer id="legend" class="legend"></footer>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
